const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function txt(s, x, y, size, fill, align, stroke) {

  g.lineJoin = 'round';
  if (stroke !== false) { g.lineWidth = Math.max(3, size / 5); g.strokeStyle = INK; g.strokeText(s, x, y); }
  g.fillStyle = fill || '#fff'; g.fillText(s, x, y);
}
function circle(x, y, r, fill, line) {
  g.beginPath(); g.arc(x, y, r, 0, 7);

  if (line !== 0) { g.lineWidth = line || 3; g.strokeStyle = INK; g.stroke(); }
}

  g.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.6, y - s * 0.2, x, y + s * 0.9);
  g.fillStyle = col || '#ff4d6d'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
}

  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }

function update(dt) {

  }

  for (const p of G.parts) {

  G.meteors = G.meteors.filter(m => !m.done); G.parts = G.parts.filter(p => p.life > 0);
  G.texts = G.texts.filter(t => t.life > 0); G.bolts = G.bolts.filter(b => b.life > 0);
  G.beams = G.beams.filter(b => b.life > 0); G.omens = G.omens.filter(o => !o.done);

        draw: (cx, cy) => {
          if (open) { drawTower({ id: d.id, x: cx, y: cy + 26, lvl: 1, ang: -0.5 }, 0.58); drawCoin(cx - 17, cy + 55, 6.5); txt(String(d.cost), cx - 8, cy + 55, 14, afford ? '#ffe14d' : '#ff7a7a', 'left'); }
          else { txt('🔒', cx, cy + 26, 26, '#fff', 'center', false); txt('Mission ' + (d.req - 1), cx, cy + 54, 11, '#cfc8ff'); }
        } });
  });
  ABILITIES.forEach((a, i) => {
    const x = 510 + i * 74, open = save.unlocked >= a.req, cd = G.cd[a.id], ready = open && cd <= 0;
    btn(x, BOT + 8, 70, 66, '', () => {
      if (!open || !inPlay) return;
      if (cd > 0) { sfx('no'); return; }
      if (a.id === 'meteor') { G.armed = G.armed ? null : 'meteor'; G.placing = null; G.sel = null; sfx('click'); } else useAbility(a.id);
    }, { col: G.armed === a.id ? '#ffb347' : '#4a3aa8', disabled: !open, tip: open ? a.tip : 'Locked! Win mission ' + (a.req - 1) + ' to unlock.',
      draw: (cx, cy, w, h) => {
        if (open) {
          txt(a.icon, cx, cy + 25, 28, '#fff', 'center', false); txt(a.short, cx, cy + 54, 12, '#fff');
          if (cd > 0) { g.fillStyle = 'rgba(15,8,50,.65)'; rr(cx - w / 2 + 3, cy + 3, w - 6, h - 6, 10); g.fill(); txt(Math.ceil(cd) + 's', cx, cy + h / 2, 22, '#fff'); }
          else if (ready) { g.globalAlpha = 0.5 + 0.5 * Math.sin(T * 6); g.lineWidth = 3; g.strokeStyle = '#fff'; rr(cx - w / 2 + 3, cy + 3, w - 6, h - 6, 10); g.stroke(); g.globalAlpha = 1; }
        } else { txt('🔒', cx, cy + 26, 26, '#fff', 'center', false); txt('Mission ' + (a.req - 1), cx, cy + 54, 12, '#cfc8ff'); }
      } });
  });
  // selected tower panel
  if (G.sel && inPlay) {
    const t = G.sel, by = t.y > 170 ? t.y - 92 : t.y + 34, bx = clamp(t.x - 70, 4, W - 144);
    const uc = upCost(t), maxed = t.lvl >= 3;
    btn(bx, by, 140, 30, maxed ? 'Max level!' : 'Upgrade ' + uc, () => { if (G.coins >= uc) { G.coins -= uc; t.lvl++; t.spent += uc; sfx('ability'); burst(t.x, t.y, '#ffe14d', 12, true); } else sfx('no'); },
      { col: '#6be36b', disabled: maxed || G.coins < uc, size: 15 });
    btn(bx, by + 36, 140, 28, 'Sell +' + sellVal(t), () => { G.coins += sellVal(t); G.towers = G.towers.filter(x => x !== t); G.sel = null; sfx('coin'); }, { col: '#ff7a7a', size: 15 });
  }
  // tooltip / hint
  let msg = tip;
  if (!msg && G.placing) msg = 'Tap the map to build · tap the button again or press Esc to cancel';
  if (!msg && G.armed) msg = 'Tap where the meteors should land!';
  if (!msg && G.wave === 0 && G.towers.length === 0) msg = 'Pick a station below, then tap the map to build it next to the purple road!';
  if (msg) { g.font = 'bold 16px ' + FONT; const w = g.measureText(msg).width + 30; rr(W / 2 - w / 2, BOT - 40, w, 30, 15); g.fillStyle = 'rgba(15,8,50,.9)'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke(); txt(msg, W / 2, BOT - 25, 16, '#fff', 'center', false); }
}
function drawBanner() {
  const b = G.banners[0]; if (!b) return;
  const a = Math.min(1, (b.max - b.t) * 4, b.t * 3), w = 580, h = 62, x = W / 2 - w / 2, y = TOP + 10 - (1 - a) * 20;
  g.globalAlpha = a; rr(x, y + 4, w, h, 16); g.fillStyle = INK; g.fill(); rr(x, y, w, h, 16); g.fillStyle = 'rgba(40,24,110,.96)'; g.fill(); g.lineWidth = 4; g.strokeStyle = b.col; g.stroke();
  if (b.alien) { const D = EN[b.alien]; drawAlien({ type: b.alien, x: x + 40, y: y + 36, r: Math.min(D.r, 17), col: D.col, imm: D.imm, nobadge: true, flash: 0, hp: 1, max: 1, slowT: 0, pt: 9, cloak: false }, 1, T); }
  else txt(b.icon, x + 38, y + h / 2 + 2, 32, '#fff', 'center', false);
  txt(b.title, x + 76, y + 21, 20, b.col, 'left'); txt(b.sub, x + 76, y + 45, 14, '#fff', 'left', false);
  g.globalAlpha = 1;
}
function drawPause() {
  buttons = buttons.filter(b => b.y < 46); // HUD only (so unpause works)
  g.fillStyle = 'rgba(10,5,40,.6)'; g.fillRect(0, TOP, W, H - TOP);
  txt('Paused', 480, 250, 70, '#ffe14d');
  btn(380, 300, 200, 60, 'Keep Playing', () => { G.paused = false; }, { col: '#6be36b', size: 24 });
}
function drawEnd() {
  buttons = []; tip = '';
  g.fillStyle = 'rgba(10,5,40,.7)'; g.fillRect(0, 0, W, H);
  const win = G.state === 'win', last = G.li === LEVELS.length - 1;
  bigPanel(220, 70, 520, win ? 440 : 330);
  if (win) {
    txt(last ? 'You saved the galaxy!' : 'Mission Complete!', 480, 124, 42, '#ffe14d');
    for (let i = 0; i < 3; i++) drawStar(480 + (i - 1) * 76, 196 + (i === 1 ? -10 : 0), 34, G.stars > i ? '#ffd23f' : '#4a3d8f');
    txt(G.lives + ' hearts left on your planet', 480, 252, 20, '#fff');
    if (justUnlocked.length) {
      txt('✨ NEW UNLOCK! ✨', 480, 292, 26, '#8dffb0');
      justUnlocked.forEach((u, i) => {
        const y = 335 + i * 38;
        txt((u.kind === 'tower' ? '🛰 ' : '⚡ ') + u.o.name, 480, y, 22, '#fff');
        txt(u.o.tip.split(': ')[1], 480, y + 20, 14, '#cfc8ff', 'center', false);
      });
    } else if (last) txt('All stations & powers are yours!', 480, 300, 22, '#8dffb0');
    const y = 430;
    btn(250, y, 140, 50, 'Replay', () => startLevel(G.li), { col: '#6be3ff', size: 20 });
    btn(400, y, 140, 50, 'Map', () => { screen = 'levels'; sfx('click'); }, { col: '#ff7ad1', size: 20 });
    if (!last) btn(550, y, 170, 50, 'Next Mission ▶', () => startLevel(G.li + 1), { col: '#6be36b', size: 20 });
  } else {
    txt('Oh no!', 480, 140, 56, '#ff9db4');
    drawHeart(480, 215, 30, '#7a5a8a');
    txt('The aliens got through. Try again!', 480, 290, 22, '#fff');
    txt('Tip: upgrade your stations by tapping them.', 480, 322, 16, '#cfc8ff', 'center', false);
    btn(300, 360, 170, 56, 'Try Again', () => startLevel(G.li), { col: '#6be36b', size: 22 });
    btn(490, 360, 170, 56, 'Map', () => { screen = 'levels'; sfx('click'); }, { col: '#ff7ad1', size: 22 });
  }
}

// ============================================================
//  INPUT
// ============================================================
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointermove', e => { mouse = pt(e); });
cv.addEventListener('contextmenu', e => { e.preventDefault(); if (G) { G.placing = null; G.armed = null; G.sel = null; } });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio(); mouse = pt(e);
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) { if (!b.disabled) b.fn(); else sfx('no'); return; }
  }
  if (screen !== 'play' || !G || G.state !== 'play' || G.paused) return;
  if (mouse.y < TOP || mouse.y > BOT) return;
  if (G.armed) { useAbility(G.armed, mouse); return; }
  if (G.placing) { placeTower(mouse); return; }
  G.sel = G.towers.find(t => dist(t, mouse) < 26) || null;
});
addEventListener('keydown', e => {
  initAudio();
  if (screen !== 'play' || !G) return;
  if (e.key === 'Escape') { G.placing = null; G.armed = null; G.sel = null; }
  else if (e.key === ' ') { e.preventDefault(); if (G.state === 'play') G.paused = !G.paused; }
  else if (/^[1-8]$/.test(e.key) && G.state === 'play') { const d = TOWERS[+e.key - 1]; if (save.unlocked >= d.req) { G.placing = d.id; G.sel = null; G.armed = null; } }
});

// ============================================================
//  MAIN LOOP
// ============================================================
let last = performance.now(), FDT = 0.016;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (shakeT > 0) shakeT -= dt;
  buttons = []; tip = ''; FDT = dt;
  mus = screen === 'play' && G ? G.li : 0;
  if (screen === 'play' && G) { for (let i = 0; i < G.speed; i++) update(dt); drawPlay(); }
  else if (screen === 'levels') drawLevels();
  else drawTitle();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
